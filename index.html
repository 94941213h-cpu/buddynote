<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B4D3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="버디노트">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>버디노트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 스플래시 -->
  <div id="splash">
    <div class="splash-icon">⛳</div>
    <div class="splash-title">버디노트</div>
    <div class="splash-sub">나만의 골프 다이어리</div>
  </div>

  <!-- 메인 앱 -->
  <div id="main" class="hidden">

    <!-- 헤더 -->
    <header id="header">
      <button id="btn-back" class="icon-btn hidden">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="header-title">버디노트</h1>
      <button id="btn-settings" class="icon-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>

    <!-- 탭 패널들 -->
    <div id="panels">

      <!-- 예약 탭 -->
      <div id="panel-reservation" class="panel active">
        <div id="reservation-list-view">
          <div id="reservation-list"></div>
          <button id="btn-add-round" class="fab">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="reservation-detail-view" class="hidden">
          <div id="reservation-detail"></div>
        </div>
      </div>

      <!-- 준비 탭 -->
      <div id="panel-prepare" class="panel">
        <div id="prepare-content"></div>
      </div>

      <!-- 기록 탭 -->
      <div id="panel-history" class="panel">
        <div id="history-content"></div>
      </div>

    </div>

    <!-- 하단 네비게이션 -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-tab="reservation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="19" r="2"/><path d="M12 17V7"/><path d="M12 7l7 4"/></svg>
        <span>라운드</span>
      </button>
      <button class="nav-item" data-tab="prepare">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span>준비</span>
      </button>
      <button class="nav-item" data-tab="history">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        <span>기록</span>
      </button>
    </nav>

  </div><!-- /main -->

</div><!-- /app -->

<!-- 모달 (바텀 시트) -->
<div id="modal-overlay" class="hidden">
  <div id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast" class="hidden"></div>

<script src="golf_db.js"></script>
<script src="app.js"></script>
</body>
</html>
